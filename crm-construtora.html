<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>

    --ov-danger: #c45c4a;
    --ov-ok: #7d9a6a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ov-bg); color: var(--ov-cream); }
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, .ov-serif { font-family: Fraunces, Georgia, serif; font-weight: 560; letter-spacing: -0.02em; }
  h1 { font-size: clamp(32px, 4vw, 44px); margin: 8px 0 0; }
  h2 { font-size: 28px; margin: 0; }

  a { color: var(--ov-gold-2); }

    outline: 2px solid var(--ov-gold); outline-offset: 2px;
  }
  .grain {
    pointer-events: none; position: fixed; inset: 0; z-index: 40; opacity: 0.07;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .shell { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
  .side {
    background: var(--ov-bg-2); border-right: 1px solid var(--ov-line);
    padding: 22px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; }

  .nav { display: flex; flex-direction: column; gap: 4px; }

  }
  .nav-btn {
    text-align: left; background: transparent; color: var(--ov-muted); border: 0; border-radius: 12px;
    padding: 10px 12px; font-weight: 600;
  }
  .nav-btn.is-on { background: var(--ov-gold); color: #16120c; }
  .nav-btn:hover:not(.is-on) { background: rgba(255,255,255,.05); color: var(--ov-cream); }
  .side-foot { margin-top: auto; color: var(--ov-muted); font-size: 12px; padding: 12px; }
  .main { min-width: 0; padding: 28px 22px 80px; max-width: 1180px; }

  .hint, .stat em, .muted { font-size: 12px; font-style: normal; }

  .lots.qc { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .lot {
    position: relative; min-height: 64px; border-radius: 10px; border: 1px solid rgba(196,165,116,.28);
    background: #121614; color: var(--ov-cream); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px;
  }
  .lot strong { font-family: Fraunces, Georgia, serif; font-size: 13px; font-weight: 560; }
  .lot > span { font-size: 11px; opacity: .7; }
  .lot.reservado { border-style: dashed; }
  .lot.vendido, tr.is-lock { opacity: .45; }
  .lot.vendido strong { text-decoration: line-through; }
  .lot.is-lock, tr.is-lock { cursor: not-allowed; }
  .lot.is-on { background: var(--ov-gold); color: #16120c; border-style: solid; border-color: var(--ov-gold); }
  .lot:hover:not(.is-lock):not(.is-on) { border-color: var(--ov-gold); }
  .ord {
    position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; border-radius: 99px;
    background: #16120c; color: #e4c9a0; font-size: 10px; display: grid; place-items: center;
  }
  .bosque {
    margin-top: 8px; padding: 14px; border-radius: 12px; text-align: center;
    background: rgba(125,154,106,.14); color: #cfe0c4; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--ov-muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(196,165,116,.45); background: #121614; }
  .sw.reservado { border-style: dashed; }

  .sw.is-on { background: var(--ov-gold); border-color: var(--ov-gold); }
  .lot-panel { padding: 16px; }
  .money-stack div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--ov-line); font-size: 14px; }

  .table-wrap { margin-top: 16px; padding: 14px; overflow-x: auto; }
  .table-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .table-tools input { flex: 1 1 220px; max-width: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ov-muted); padding: 8px; }
  td { padding: 9px 8px; border-top: 1px solid var(--ov-line); }
  tbody tr { cursor: pointer; }
  tbody tr.is-on td { background: rgba(196,165,116,.14); }
  .flag { margin-top: 16px; color: var(--ov-gold-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chips span { border: 1px solid var(--ov-line); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--ov-gold-2); }
  .sheet { margin-top: 14px; background: #f4efe6; color: #16120c; border-radius: 18px; padding: 28px 22px 36px; color-scheme: light; }
  .sheet-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .sheet .eyebrow { letter-spacing: .14em; text-transform: uppercase; font-size: 11px; font-weight: 600; color: #7a6850; margin-top: 18px; }
  .sheet h2 { font-size: clamp(26px, 3vw, 34px); margin-top: 8px; }
  .sheet h3 { font-family: Inter, sans-serif; font-size: 14px; margin: 0 0 4px; }
  .sheet p { line-height: 1.55; overflow-wrap: break-word; }
  .clause { margin-top: 16px; font-size: 14px; }
  .clause p { white-space: pre-wrap; opacity: .82; }
  .metrics { margin-top: 16px; }
  .metrics p { font-size: 14px; }
  .signs { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 28px; padding-top: 16px; border-top: 1px solid rgba(22,18,12,.12); }
  .sig { display: block; height: 88px; max-width: 260px; object-fit: contain; object-position: left center; }
  .sheet .muted { color: #6d6458; }
  #pad { width: 100%; height: 140px; background: #fff; border-radius: 12px; touch-action: none; cursor: crosshair; display: block; }
  .pad-box { margin-top: 14px; }
  .gate {
    min-height: 100vh; display: grid; place-items: center; padding: 28px 16px;
    background: radial-gradient(900px 480px at 50% 0%, rgba(196,165,116,.16), transparent 60%), var(--ov-bg);
  }
  .gate-card { width: min(440px, 100%); text-align: left; }
  .gate-card h1 { margin-top: 12px; }
  .gate-card .lead { margin-bottom: 22px; }
  .google-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
    background: #fff; color: #1f1f1f; border: 0; border-radius: 999px; padding: 12px 16px;
    font-weight: 600; cursor: pointer;
  }
  .google-btn:disabled { opacity: .7; cursor: wait; }
  .google-btn svg { width: 18px; height: 18px; flex: none; }
  .logout { margin-top: 8px; background: transparent; border: 0; color: var(--ov-muted); text-align: left; cursor: pointer; padding: 8px 12px; }
  details summary { cursor: pointer; font-weight: 600; }
  @media (min-width: 760px) {
    .cards-2, .split { grid-template-columns: 1fr 1fr; }
    .sheet { padding: 42px 48px; }
  }
  @media (min-width: 980px) {
    .carteira, .plan-layout { grid-template-columns: 1.35fr .85fr; align-items: start; }
    .carteira-form, .lot-panel { position: sticky; top: 12px; }
  }
  @media (max-width: 900px) {
    .shell { display: block; }
    .side { position: sticky; top: 0; z-index: 5; height: auto; border-right: 0; border-bottom: 1px solid var(--ov-line); }
    .nav { flex-direction: row; overflow: auto; }
    .who, .side-foot { display: none; }
    .nav-btn { white-space: nowrap; }
    .stats, .metrics, .flows, .grid-2, .signs { grid-template-columns: 1fr; }
    .lots.qa, .lots.qb, .lots.qc { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media print {
    @page { margin: 14mm; }
    body { background: #fff; }
    body * { visibility: hidden; }
    .sheet, .sheet * { visibility: visible; }
    .sheet { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; }
    .no-print, .no-print * { display: none !important; visibility: hidden !important; }
  }
</style>

<script>
const KEY = 'yes-absoluto-crm-v1';
const AUTH_KEY = 'yes-oauth-demo';
const COMMISSION_RATE = 0.06;
const ENTRADA_RATE = 0.1;
const DIRETO_TERM = 72;
const FOLLOWUP_DAYS = 7;
const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const FLOWS = [
  { id: 'direto', name: 'Direto com a construtora', short: 'Direto', tag: 'Entrada de 10% + saldo em até 72x. Correção pelo CUB/SC.' },
  { id: 'avista', name: 'À vista', short: 'À vista', tag: 'Valor integral da tabela, em parcela única.' },
];
const CONTRACT_LABEL = { rascunho: 'Rascunho', enviado: 'Enviado', assinado: 'Assinado', pago: 'Pago' };
const COMMISSION_LABEL = { pendente: 'Pendente', a_receber: 'A receber', recebido: 'Recebido', bloqueado: 'Bloqueado' };
const STATUS_LABEL = { disponivel: 'Disponível', reservado: 'Reservado', vendido: 'Vendido' };
const CLIENT_LABEL = { prospecto: 'Interessado', ativo: 'Em negociação', perdido: 'Perdido' };
const TITLES = { inicio: 'Início', carteira: 'Carteira', planta: 'Tabela', contratos: 'Contratos', comissoes: 'Comissões', painel: 'Painel' };
const FILTERS = [['todos','Todos'],['prospecto','Interessados'],['ativo','Em negociação'],['perdido','Perdidos']];
const LOT_FILTERS = [['todos','Todos'],['disponivel','Disponíveis'],['reservado','Reservados'],['vendido','Vendidos']];

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;' }[ch]));
}
function uid(prefix) {
  return prefix + '-' + Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36);
}
function round(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
function money(value) {
  return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value) || 0);
}
function formatDate(iso) {
  const date = iso instanceof Date ? iso : new Date(iso);
  if (!Number.isFinite(date.getTime())) return '—';
  return new Intl.DateTimeFormat('pt-BR').format(date);
}
function daysAgo(n) { return new Date(Date.now() - n * 86400000).toISOString(); }
function daysBetween(iso) {
  const t = new Date(iso).getTime();
  if (!Number.isFinite(t)) return 0;
  return Math.floor((Date.now() - t) / 86400000);
}
function nextMonday() {
  const date = new Date();
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + ((1 - date.getDay() + 7) % 7));
  return date;
}
function maskCpf(v) {
  const d = String(v || '').replace(/\D/g, '').slice(0, 11);
  let out = d.slice(0, 3);
  if (d.length > 3) out += '.' + d.slice(3, 6);
  if (d.length > 6) out += '.' + d.slice(6, 9);
  if (d.length > 9) out += '-' + d.slice(9, 11);
  return out;
}
function maskCnpj(v) {
  const d = String(v || '').replace(/\D/g, '').slice(0, 14);
  let out = d.slice(0, 2);
  if (d.length > 2) out += '.' + d.slice(2, 5);
  if (d.length > 5) out += '.' + d.slice(5, 8);
  if (d.length > 8) out += '/' + d.slice(8, 12);
  if (d.length > 12) out += '-' + d.slice(12, 14);
  return out;
}
function maskPhone(v) {
  const d = String(v || '').replace(/\D/g, '').slice(0, 11);
  if (!d) return '';
  if (d.length < 3) return '(' + d;
  if (d.length < 7) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}
function applyMask(kind, value) {
  if (kind === 'doc') return S.form.kind === 'pj' ? maskCnpj(value) : maskCpf(value);
  if (kind === 'phone') return maskPhone(value);
  return value;
}
function parseMoney(v) {
  let raw = String(v ?? '').trim().replace(/\s/g, '');
  if (!raw) return 0;
  if (raw.includes(',')) return Number(raw.replace(/\./g, '').replace(',', '.')) || 0;
  if (/^\d{1,3}(\.\d{3})+$/.test(raw)) return Number(raw.replace(/\./g, '')) || 0;
  return Number(raw) || 0;
}
function whatsappHref(phone) {
  const d = String(phone || '').replace(/\D/g, '');
  if (!d) return '';
  return 'https://wa.me/' + (d.startsWith('55') ? d : '55' + d);
}
function flowById(id) { return FLOWS.find((item) => item.id === id) || FLOWS[1]; }
function addr(c) {
  if (!c) return '—';
  const city = [c.city, c.state].filter(Boolean).join('/');
  return [c.address, city].filter(Boolean).join(' — ') || '—';
}
function emptyForm() {
  return {
    kind: 'pf', name: '', doc: '', rg: '', civil: 'solteiro(a)', profession: '',
    contactName: '', role: '', address: '', city: '', state: 'SC', whatsapp: '', email: '',
    notes: '', origem: 'autonomo', imobiliaria: '', status: 'prospecto',
  };
}
function defaultDraft() {
  return {
    clientId: '', flowId: 'direto', term: 72, entradaRate: 0.1, customEntrada: '',
    vagas: 0, itbiComprador: true, permuta: false, fgts: false, lotIds: [],
  };
}
function defaultUi() {
  return {
    filter: 'todos', editing: null, lotFilter: 'todos', tipoFilter: 'todos', lotSearch: '',
    contractMode: 'live', previewId: null, lookupError: '', importMsg: '', looking: false,
  };
}
function logo(size) {
  return `<svg viewBox="0 0 48 48" width="${size}" height="${size}" role="img" aria-label="YES Construtora"><rect width="48" height="48" rx="10" fill="#101411"/><rect x="0.6" y="0.6" width="46.8" height="46.8" rx="9.4" fill="none" stroke="rgba(196,165,116,0.35)"/><path d="M24 9 39 24 24 39 9 24Z" fill="none" stroke="#C4A574" stroke-width="1.4"/><path d="M24 17 31 24 24 31 17 24Z" fill="#C4A574"/></svg>`;

function quoteFrom(lots, flowId) {
  const flow = flowById(flowId);
  const book = window.ABSOLUTO || {};
  if (!lots.length) {
    return {
      flowId: flow.id, flowName: flow.name, lines: [], table: 0, remainder: 0, billed: 0,
      note: 'Selecione uma unidade na tabela.', sale: 0, entrada: 0, saldo: 0, parcela: 0,
      commission: 0, discountLabel: '', term: DIRETO_TERM, entradaRate: ENTRADA_RATE,
    };
  }
  const lines = lots.map((lot) => ({ lot, value: round(lot.price), label: 'tabela de 16.10.2026' }));
  const table = round(lines.reduce((acc, line) => acc + line.value, 0));
  const note = (book.note || '') + ' ' + (book.payment || 'Entrada de 10% + saldo em até 72x. Correção pelo CUB/SC.');
  let sale = table;
  let entrada = 0;
  let saldo = 0;
  let parcela = 0;
  let discountLabel = 'valor de tabela, sem desconto lançado';
  if (flow.id === 'avista') {
    entrada = sale;
    discountLabel = 'à vista, valor integral da tabela';
  } else {
    entrada = round(table * ENTRADA_RATE);
    saldo = round(table - entrada);
    sale = round(entrada + saldo);
    parcela = round(saldo / DIRETO_TERM);
    discountLabel = '10% de entrada e saldo em 72x, corrigido pelo CUB/SC';
  }
  return {
    flowId: flow.id, flowName: flow.name, lines, table, remainder: 0, billed: lots.length, note,
    sale, entrada, saldo, parcela, commission: round(sale * COMMISSION_RATE),
    discountLabel, term: DIRETO_TERM, entradaRate: ENTRADA_RATE,
  };
}

  return '<div class="grain"></div><div class="gate"><div class="gate-card"><div class="brand">' + logo(42) + '<span><strong>YES</strong><small>Construtora</small></span></div><p class="ov-kicker" style="margin-top:28px">Área dos corretores</p><h1>Olá.</h1><p class="lead">Absoluto Residence, Porto Belo. Entre para ver a tabela de vendas e as minutas.</p><button type="button" class="google-btn" id="google-login">' + googleMark() + '<span>Entrar com o Google</span></button><p class="hint" style="margin-top:14px">Demonstração. O Google ainda não confere a conta de verdade. Este botão entra como David.</p></div></div>';
}
function render(opts) {
  if (!authed()) {
    app.innerHTML = loginHtml();
    document.title = 'Entrar · YES Construtora';
    const btn = document.getElementById('google-login');
    if (btn) btn.addEventListener('click', () => {
      btn.disabled = true;
      const label = btn.querySelector('span');
      if (label) label.textContent = 'Conectando…';
      window.setTimeout(() => {
        sessionStorage.setItem(AUTH_KEY, 'david');
        render({ top: true });
      }, 700);
    });
    return;
  }
  const top = opts && opts.top;
  const y = top ? 0 : window.scrollY;
  app.innerHTML = shell(page());
  document.title = (TITLES[S.view] || 'CRM') + ' — YES Construtora';
  bindPad();
  window.scrollTo(0, y);
}
function go(view) {
  S.view = view;
  persist();
  render({ top: true });
}
function syncMarks() {
  document.querySelectorAll('[data-act="flow"]').forEach((btn) => btn.classList.toggle('is-on', btn.dataset.flow === S.draft.flowId));
  document.querySelectorAll('[data-act="term"]').forEach((btn) => btn.classList.toggle('is-on', Number(btn.dataset.term) === Number(S.draft.term)));
  document.querySelectorAll('[data-act="rate"]').forEach((btn) => btn.classList.toggle('is-on', Number(btn.dataset.rate) === Number(S.draft.entradaRate)));
  const direto = document.getElementById('bloco-direto');
  const fin = document.getElementById('bloco-fin');
  if (direto) direto.hidden = S.draft.flowId !== 'direto';
  if (fin) fin.hidden = S.draft.flowId !== 'financiamento';
}
function paintLive() {
  const lines = document.getElementById('panel-lines');
  if (lines) lines.innerHTML = lotLinesHtml();
  const nums = document.getElementById('panel-numbers');
  if (nums) nums.innerHTML = numbersHtml(currentQuote(), false);
  const sum = document.getElementById('lot-summary');
  if (sum) sum.innerHTML = lotSummaryHtml();
  const quote = document.getElementById('quote-box');
  if (quote) quote.innerHTML = quoteBoxInner();
  const reason = blockReason();
  const btn = document.getElementById('btn-generate');
  if (btn) btn.disabled = Boolean(reason);
  const why = document.getElementById('block-reason');
  if (why) why.textContent = reason;
  if (S.ui.contractMode === 'live') {
    const host = document.getElementById('contract-host');
    if (host) host.innerHTML = sheetHtml(liveDoc());
  }
}
function paintLots() {
  document.querySelectorAll('[data-lot]').forEach((el) => {
    const index = S.draft.lotIds.indexOf(el.dataset.lot);
    el.classList.toggle('is-on', index >= 0);
    if (!el.classList.contains('lot')) return;
    let badge = el.querySelector('.ord');
    if (index >= 0) {
      if (!badge) el.insertAdjacentHTML('afterbegin', '<span class="ord">' + (index + 1) + '</span>');
      else badge.textContent = String(index + 1);
    } else if (badge) badge.remove();
  });
}
function toggleLot(id) {
  const lot = S.lots.find((item) => item.id === id);
  if (!lot || isLocked(lot)) return;
  const index = S.draft.lotIds.indexOf(id);
  if (index >= 0) S.draft.lotIds.splice(index, 1);
  else S.draft.lotIds.push(id);
  persist();
  paintLots();
  syncMarks();
  paintLive();
}
function setDraft(key, value) {
  S.draft[key] = value;
  persist();
  syncMarks();
  paintLive();
}
function loadClient(id) {
  const client = clientOf(id);
  if (!client) return;
  S.ui.editing = id;
  S.form = {
    kind: client.kind, name: client.name, doc: client.doc, rg: client.rg || '', civil: client.civil || 'solteiro(a)',
    profession: client.profession || '', contactName: client.contactName || '', role: client.role || '',
    address: client.address || '', city: client.city || '', state: client.state || 'RS', whatsapp: client.whatsapp || '',
    email: client.email || '', notes: client.notes || '', origem: client.origem || 'autonomo',
    imobiliaria: client.imobiliaria || '', status: client.status || 'prospecto',
  };
  render();
}
function saveClient() {
  const form = S.form;
  if (!form.name.trim()) return;
  const now = new Date().toISOString();
  if (S.ui.editing) {
    const current = clientOf(S.ui.editing);
    if (current) Object.assign(current, form, { name: form.name.trim() });
  } else {
    S.clients.unshift(Object.assign({}, form, { name: form.name.trim(), id: uid('cli'), createdAt: now, lastTouchAt: now }));
  }
  S.form = emptyForm();
  S.ui.editing = null;
  S.ui.lookupError = '';
  persist();
  render();
}
function touch(id) {
  const client = clientOf(id);
  if (!client) return;
  client.lastTouchAt = new Date().toISOString();
  persist();
  render();
}
async function buscarCnpj() {
  const digits = String(S.form.doc || '').replace(/\D/g, '');
  if (digits.length !== 14) {
    S.ui.lookupError = 'CNPJ precisa ter 14 dígitos.';
    render();
    return;
  }
  S.ui.looking = true;
  S.ui.lookupError = '';
  render();
  try {
    const res = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + digits);
    if (!res.ok) throw new Error('CNPJ não encontrado');
    const data = await res.json();
    S.form.name = data.nome_fantasia || data.razao_social || S.form.name;
    S.form.doc = maskCnpj(digits);
    const street = [data.logradouro, data.numero].filter(Boolean).join(', ');
    S.form.address = [street, data.bairro].filter(Boolean).join(' — ') || S.form.address;
    S.form.city = data.municipio || S.form.city;
    S.form.state = data.uf || S.form.state;
    S.ui.lookupError = '';
  } catch (err) {
    S.ui.lookupError = err instanceof Error ? err.message : 'CNPJ não encontrado';
  } finally {
    S.ui.looking = false;
    render();
  }
}
function runImport() {
  const text = document.getElementById('import-text') ? document.getElementById('import-text').value : '';
  const now = new Date().toISOString();
  let n = 0;
  text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean).forEach((line) => {
    const parts = line.split(/[;\t]/).map((item) => item.trim());
    if (!parts[0]) return;
    const digits = String(parts[1] || '').replace(/\D/g, '');
    const kind = digits.length > 11 ? 'pj' : 'pf';
    S.clients.unshift({
      id: uid('cli'), kind, name: parts[0], doc: digits ? (kind === 'pj' ? maskCnpj(digits) : maskCpf(digits)) : '',
      rg: '', civil: '', profession: '', contactName: '', role: '', address: '', city: parts[2] || '', state: 'RS',
      whatsapp: maskPhone(parts[3] || ''), email: '', notes: '', origem: 'autonomo', imobiliaria: '',
      status: 'prospecto', createdAt: now, lastTouchAt: now,
    });
    n += 1;
  });
  S.ui.importMsg = n ? n + ' cliente(s) importado(s).' : 'Nenhuma linha válida.';
  persist();
  render();
}
function generate() {
  const reason = blockReason();
  if (reason) return;
  const rec = buildRecord(S, S.draft);
  S.contracts.unshift(rec);
  const client = clientOf(S.draft.clientId);
  client.status = 'ativo';
  client.lastTouchAt = rec.createdAt;
  S.draft.lotIds = S.draft.lotIds.filter((id) => !rec.lotIds.includes(id));
  S.ui.contractMode = 'record';
  S.ui.previewId = rec.id;
  S.padData = '';
  S.padDirty = false;
  persist();
  render();
  const host = document.getElementById('contract-host');
  if (host) host.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function openContract(id) {
  S.ui.contractMode = 'record';
  S.ui.previewId = id;
  S.padData = '';
  S.padDirty = false;
  render();
  const host = document.getElementById('contract-host');
  if (host) host.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function sendContract(id) {
  const rec = S.contracts.find((item) => item.id === id);
  if (!rec || rec.status !== 'rascunho') return;
  rec.status = 'enviado';
  rec.sentAt = new Date().toISOString();
  persist();
  render();
}
function sign(id) {
  if (!S.padData) return;
  const rec = S.contracts.find((item) => item.id === id);
  if (!rec) return;
  rec.signature = S.padData;
  rec.signedAt = new Date().toISOString();
  if (rec.status !== 'pago') rec.status = 'assinado';
  S.padData = '';
  S.padDirty = false;
  persist();
  render();
}
function markPaid(id) {
  const rec = S.contracts.find((item) => item.id === id);
  if (!rec || rec.status === 'pago') return;
  rec.status = 'pago';
  rec.paidAt = new Date().toISOString();
  if (rec.commissionStatus !== 'bloqueado') rec.commissionStatus = 'a_receber';
  persist();
  render();
}
function discard(id) {
  const rec = S.contracts.find((item) => item.id === id);
  if (!rec || rec.status !== 'rascunho') return;
  if (!window.confirm('Descartar esta minuta e liberar as unidades?')) return;
  S.contracts = S.contracts.filter((item) => item.id !== id);
  if (S.ui.previewId === id) {
    S.ui.previewId = null;
    S.ui.contractMode = 'live';
  }
  persist();
  render();
}
function payAll() {
  const now = new Date().toISOString();
  S.contracts.forEach((item) => {
    if (item.commissionStatus === 'a_receber') {
      item.commissionStatus = 'recebido';
      item.receivedAt = now;
    }
  });
  persist();
  render();
}
function resetDemo() {
  if (!window.confirm('Restaurar os dados de apresentação deste navegador?')) return;
  localStorage.removeItem(KEY);
  S = seed();
  persist();
  render({ top: true });
}
function bindPad() {
  const canvas = document.getElementById('pad');
  if (!canvas || canvas.dataset.bound) return;
  canvas.dataset.bound = '1';
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(rect.width * 2));
  canvas.height = Math.max(1, Math.floor(rect.height * 2));
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.lineWidth = 1.7;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#16120c';
  ctx.fillStyle = '#16120c';
  if (S.padData) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = S.padData;
  }
  let drawing = false;
  let moved = false;
  let last = null;
  const pos = (ev) => {
    const box = canvas.getBoundingClientRect();
    return { x: ev.clientX - box.left, y: ev.clientY - box.top };
  };
  canvas.addEventListener('pointerdown', (ev) => {
    drawing = true;
    moved = false;
    last = pos(ev);
    canvas.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });
  canvas.addEventListener('pointermove', (ev) => {
    if (!drawing) return;
    const point = pos(ev);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(point.x, point.y);
    ctx.stroke();
    last = point;
    moved = true;
    ev.preventDefault();
  });
  const finish = () => {
    if (!drawing) return;
    drawing = false;
    if (!moved && last) {
      ctx.beginPath();
      ctx.arc(last.x, last.y, 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
    S.padDirty = true;
    S.padData = canvas.toDataURL();
    const btn = document.getElementById('btn-sign');
    if (btn) btn.disabled = false;
  };
  canvas.addEventListener('pointerup', finish);
  canvas.addEventListener('pointercancel', finish);
}
function clearPad() {
  S.padData = '';
  S.padDirty = false;
  const canvas = document.getElementById('pad');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }
  const btn = document.getElementById('btn-sign');
  if (btn) btn.disabled = true;
}
function onClick(ev) {
  const el = ev.target.closest('[data-act]');
  if (!el || !app.contains(el)) return;
  const act = el.dataset.act;
  if (act === 'go') go(el.dataset.view);
  else if (act === 'lot') toggleLot(el.dataset.lot);
  else if (act === 'flow') setDraft('flowId', el.dataset.flow);
  else if (act === 'term') setDraft('term', Number(el.dataset.term));
  else if (act === 'rate') setDraft('entradaRate', Number(el.dataset.rate));
  else if (act === 'kind') { S.form.kind = el.dataset.kind; render(); }
  else if (act === 'filter') { S.ui.filter = el.dataset.value; render(); }
  else if (act === 'lot-filter') { S.ui.lotFilter = el.dataset.value; render(); }
  else if (act === 'tipo-filter') { S.ui.tipoFilter = el.dataset.value; render(); }
  else if (act === 'logout') { sessionStorage.removeItem(AUTH_KEY); render({ top: true }); }
  else if (act === 'edit-client') loadClient(el.dataset.id);
  else if (act === 'cancel-edit') { S.form = emptyForm(); S.ui.editing = null; S.ui.lookupError = ''; render(); }
  else if (act === 'touch') touch(el.dataset.id);
  else if (act === 'cnpj') buscarCnpj();
  else if (act === 'generate') generate();
  else if (act === 'open-contract') openContract(el.dataset.id);
  else if (act === 'live-preview') { S.ui.contractMode = 'live'; S.ui.previewId = null; render(); }
  else if (act === 'send') sendContract(el.dataset.id);
  else if (act === 'sign') sign(el.dataset.id);
  else if (act === 'paid') markPaid(el.dataset.id);
  else if (act === 'discard') discard(el.dataset.id);
  else if (act === 'print') window.print();
  else if (act === 'clear-pad') clearPad();
  else if (act === 'pay-all') payAll();
  else if (act === 'reset') resetDemo();
}
function readControl(el) {
  if (el.dataset.form) {
    S.form[el.dataset.form] = el.value;
    if (el.dataset.mask) {
      const masked = applyMask(el.dataset.mask, el.value);
      el.value = masked;
      S.form[el.dataset.form] = masked;
    }
    if (el.dataset.form === 'origem') {
      const block = document.getElementById('bloco-imob');
      if (block) block.hidden = el.value !== 'imobiliaria';
    }
    return;
  }
  if (el.dataset.company) { S.company[el.dataset.company] = el.value; touchOrg(); return; }
  if (el.dataset.rep) { S.rep[el.dataset.rep] = el.value; touchOrg(); return; }
  if (el.dataset.project) { S.project[el.dataset.project] = el.value; touchOrg(); return; }
  if (el.dataset.draft) {
    let value = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.num) value = Math.max(0, Number(value) || 0);
    S.draft[el.dataset.draft] = value;
    persist();
    paintLive();
  }
}
function touchOrg() {
  persist();
  const note = document.getElementById('org-note');
  if (note) note.textContent = 'Salvo neste navegador. Minutas novas usam este texto.';
}
function onInput(ev) {
  const el = ev.target;
  if (el.dataset && el.dataset.role === 'lot-search') {
    S.ui.lotSearch = el.value;
    const body = document.getElementById('lot-rows');
    if (body) body.innerHTML = lotRows();
    return;
  }
  if (el.dataset) readControl(el);
}
function onChange(ev) {
  const el = ev.target;
  if (!el.dataset) return;
  if (el.dataset.clientStatus) {
    const client = clientOf(el.dataset.clientStatus);
    if (client) client.status = el.value;
    persist();
    render();
    return;
  }
  if (el.dataset.commission) {
    const rec = S.contracts.find((item) => item.id === el.dataset.commission);
    if (rec) {
      rec.commissionStatus = el.value;
      if (el.value === 'recebido') rec.receivedAt = new Date().toISOString();
    }
    persist();
    render();
    return;
  }
  readControl(el);
}
function onSubmit(ev) {
  ev.preventDefault();
  const act = ev.target.dataset.act;
  if (act === 'save-client') saveClient();
  if (act === 'import-leads') runImport();
}

const app = document.getElementById('app');
let S = load();
app.addEventListener('click', onClick);
app.addEventListener('input', onInput);
app.addEventListener('change', onChange);
app.addEventListener('submit', onSubmit);
render({ top: true });
</script>
